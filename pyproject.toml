[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddbj-submission-tools"
version = "0.6.0"
description = "Tools to help DDBJ submissions. Nucleotide sequences (MSS): GFF3 canonicalization, MSS conversion, annotation fixes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "biopython>=1.83",
    "pandas",
    "openpyxl",
    "jsonschema",
]

[project.scripts]
# MSS conversion (the portal calls these; keep names, options and outputs stable)
egapx2mss         = "ddbj_submission_tools.nuc.egapx2mss.cli:main"
mss_builder       = "ddbj_submission_tools.nuc.mss_builder.cli:main"
mss2ff            = "ddbj_submission_tools.nuc.mss2ff.cli:main"
batch_wgs_builder = "ddbj_submission_tools.nuc.batch_wgs_builder.cli:main"
tsa2mss           = "ddbj_submission_tools.nuc.tsa2mss.cli:main"
ann_meta          = "ddbj_submission_tools.nuc.ann_meta.cli:main"
# GFF -> MSS and annotation fixes
gff2mss           = "ddbj_submission_tools.nuc.gff2mss.cli:main"
ann_fix           = "ddbj_submission_tools.nuc.ann_fix.cli:main"
# GFF3 canonicalization (ddbj_gff). Not named "ddbj-gff": that name is the separate Rust converter.
gff_from_tool     = "ddbj_submission_tools.nuc.ddbj_gff.tools.cli:main"
gff_normalize     = "ddbj_submission_tools.nuc.ddbj_gff.normalize.cli:main"
gff_repair        = "ddbj_submission_tools.nuc.ddbj_gff.repair.cli:main"
gff_validate      = "ddbj_submission_tools.nuc.ddbj_gff.validate.cli:main"
flatfile2gff      = "ddbj_submission_tools.nuc.ddbj_gff.flatfile.cli:main"
# DDBJ account login (device flow)
ddbj-auth         = "ddbj_submission_tools.auth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ddbj_submission_tools"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
